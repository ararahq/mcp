name: ararahq-mcp
displayName: AraraHQ MCP
description: "MCP server for the AraraHQ API. Send to your base, see what came back, answer who replied. AraraHQ: WhatsApp for Brazilian companies. Team inbox with AI, campaigns and systems connected through the API."
homepage: https://docs.ararahq.com/mcp-server
repository: https://github.com/ararahq/mcp
license: MIT
author: AraraHQ
keywords:
  - whatsapp
  - broadcast
  - campaigns
  - ararahq
  - oauth

transports:
  - stdio

runtime:
  command: npx
  args:
    - "-y"
    - "@ararahq/mcp"

config:
  type: object
  properties: {}
  required: []
