name: ararahq-mcp
displayName: AraraHQ MCP
description: Official AraraHQ MCP for WhatsApp broadcasts and campaigns. Send to your base, see what came back, answer who replied.
homepage: https://ararahq.com/mcp
repository: https://github.com/ararahq/mcp
license: MIT
author: AraraHQ
keywords:
  - whatsapp
  - broadcast
  - campaigns
  - ararahq
  - oauth

transports:
  - stdio
  - streamable-http

runtime:
  command: npx
  args:
    - "-y"
    - "@ararahq/mcp"

config:
  type: object
  properties: {}
  required: []
